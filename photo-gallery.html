<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thư Viện Ảnh Tương Tác</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0d0b;
      --surface: #1a1814;
      --border: #2e2b25;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --cream: #f5f0e8;
      --muted: #8a8070;
      --preview-h: 340px;
    }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 2.5rem 1.5rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      color: var(--gold-light);
      letter-spacing: 0.03em;
      line-height: 1.15;
    }

    header p {
      margin-top: 0.5rem;
      color: var(--muted);
      font-weight: 300;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── Preview Panel ── */
    #preview-wrapper {
      max-width: 820px;
      margin: 0 auto 3rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    #image {
      width: 100%;
      height: var(--preview-h);
      background-color: var(--surface);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-image 0.4s ease, background-color 0.4s ease;
      position: relative;
    }

    #image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10,9,7,0.55) 0%, transparent 55%);
      pointer-events: none;
    }

    #caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 2;
      padding: 1.2rem 1.6rem;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--cream);
      opacity: 0.92;
      transition: opacity 0.3s;
    }

    #placeholder-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--muted);
      font-size: 1rem;
      letter-spacing: 0.04em;
      z-index: 1;
      text-align: center;
      padding: 1rem;
      transition: opacity 0.3s;
    }

    /* ── Thumbnail Grid ── */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      max-width: 820px;
      margin: 0 auto;
    }

    .thumb-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 3px;
      border: 1px solid var(--border);
      cursor: pointer;
      aspect-ratio: 4/3;
      background: var(--surface);
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(.25,.46,.45,.94), filter 0.4s;
      filter: brightness(0.82) saturate(0.85);
    }

    .thumb-wrap:hover img {
      transform: scale(1.07);
      filter: brightness(1) saturate(1.1);
    }

    .thumb-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(10,9,7,0.8) 0%, transparent 100%);
      padding: 0.6rem 0.75rem 0.5rem;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .thumb-wrap:hover .thumb-label {
      opacity: 1;
      transform: translateY(0);
    }

    /* gold accent bar on hover */
    .thumb-wrap::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.35s ease;
      z-index: 3;
    }

    .thumb-wrap:hover::before {
      transform: scaleX(1);
    }

    footer {
      text-align: center;
      margin-top: 3.5rem;
      color: var(--border);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<header>
  <h1>Thư Viện Ảnh</h1>
  <p>Di chuột để khám phá</p>
</header>

<!-- Preview panel -->
<div id="preview-wrapper">
  <div id="image">
    <span id="placeholder-text">Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.</span>
    <div id="caption"></div>
  </div>
</div>

<!-- Thumbnail grid -->
<div class="gallery-grid">

  <div class="thumb-wrap">
    <img
      src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=80"
      alt="Núi Alps hùng vĩ lúc bình minh"
      onmouseover="update(this)"
      onmouseout="undo()"
    />
    <div class="thumb-label">Alps</div>
  </div>

  <div class="thumb-wrap">
    <img
      src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=80"
      alt="Bãi biển cát trắng nhiệt đới"
      onmouseover="update(this)"
      onmouseout="undo()"
    />
    <div class="thumb-label">Biển</div>
  </div>

  <div class="thumb-wrap">
    <img
      src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=600&q=80"
      alt="Rừng thông xanh thẫm trong sương"
      onmouseover="update(this)"
      onmouseout="undo()"
    />
    <div class="thumb-label">Rừng</div>
  </div>

  <div class="thumb-wrap">
    <img
      src="https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=600&q=80"
      alt="Hoàng hôn trên sa mạc Sahara"
      onmouseover="update(this)"
      onmouseout="undo()"
    />
    <div class="thumb-label">Sa mạc</div>
  </div>

  <div class="thumb-wrap">
    <img
      src="https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?w=600&q=80"
      alt="Thác nước giữa rừng nhiệt đới"
      onmouseover="update(this)"
      onmouseout="undo()"
    />
    <div class="thumb-label">Thác nước</div>
  </div>

  <div class="thumb-wrap">
    <img
      src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=600&q=80"
      alt="Đồng cỏ xanh mướt dưới bầu trời đầy mây"
      onmouseover="update(this)"
      onmouseout="undo()"
    />
    <div class="thumb-label">Đồng cỏ</div>
  </div>

</div>

<footer>© 2026 Thư Viện Ảnh Tương Tác</footer>

<script>
  // ── Hàm UPDATE: kích hoạt khi chuột di chuyển VÀO ảnh ──
  function update(previewPic) {
    // 1. Kiểm tra sự kiện có kích hoạt không (có thể bỏ sau khi test)
    console.log("Sự kiện mouseover đã kích hoạt!");

    // 2. In thông tin về ảnh để debug
    console.log("Alt text:", previewPic.alt);
    console.log("Src:", previewPic.src);

    // 3. Cập nhật chú thích (caption) bằng alt text của ảnh
    document.getElementById("caption").textContent = previewPic.alt;

    // 4. Ẩn placeholder text
    document.getElementById("placeholder-text").style.opacity = "0";

    // 5. Cập nhật hình nền của div#image bằng src của ảnh được hover
    document.getElementById("image").style.backgroundImage =
      "url('" + previewPic.src + "')";
  }

  // ── Hàm UNDO: kích hoạt khi chuột rời KHỎI ảnh ──
  function undo() {
    // 1. Đặt lại hình nền về trạng thái ban đầu (trống)
    document.getElementById("image").style.backgroundImage = "";

    // 2. Đặt lại caption về rỗng
    document.getElementById("caption").textContent = "";

    // 3. Hiện lại placeholder text
    document.getElementById("placeholder-text").style.opacity = "1";
  }
</script>

</body>
</html>
