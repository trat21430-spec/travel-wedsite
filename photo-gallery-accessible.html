<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Thư Viện Ảnh Tương Tác</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0d0b;
    --surface: #1a1814;
    --border: #2e2b25;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #f5f0e8;
    --muted: #8a8070;
    --focus-ring: #e8c97a;
    --preview-h: 340px;
  }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 2.5rem 1.5rem 4rem;
  }

  .skip-link {
    position: absolute;
    top: -100px;
    left: 1rem;
    background: var(--gold);
    color: #000;
    padding: 0.5rem 1rem;
    border-radius: 3px;
    font-weight: 500;
    z-index: 999;
    transition: top 0.2s;
  }
  .skip-link:focus { top: 1rem; }

  header { text-align: center; margin-bottom: 3rem; }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.4rem);
    color: var(--gold-light);
    letter-spacing: 0.03em;
    line-height: 1.15;
  }

  header h2 {
    margin-top: 0.5rem;
    color: var(--muted);
    font-weight: 300;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-family: 'DM Sans', sans-serif;
  }

  .keyboard-hint {
    text-align: center;
    margin: -1.5rem auto 2rem;
    color: var(--muted);
    font-size: 0.82rem;
    letter-spacing: 0.05em;
  }

  kbd {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 0.8em;
  }

  #preview-wrapper {
    max-width: 820px;
    margin: 0 auto 3rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  #image {
    width: 100%;
    height: var(--preview-h);
    background-color: var(--surface);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-image 0.4s ease;
    position: relative;
  }

  #image::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(10,9,7,0.55) 0%, transparent 55%);
    pointer-events: none;
  }

  #caption {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 2;
    padding: 1.2rem 1.6rem;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--cream);
    opacity: 0.92;
    transition: opacity 0.3s;
  }

  #placeholder-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: var(--muted);
    font-size: 1rem;
    letter-spacing: 0.04em;
    z-index: 1;
    text-align: center;
    padding: 1rem;
    transition: opacity 0.3s;
  }

  .gallery-section { max-width: 820px; margin: 0 auto; }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem;
  }

  .thumb-wrap {
    position: relative;
    overflow: hidden;
    border-radius: 3px;
    border: 1px solid var(--border);
    cursor: pointer;
    aspect-ratio: 4/3;
    background: var(--surface);
  }

  figure { margin: 0; padding: 0; height: 100%; width: 100%; outline: none; }

  figure:focus {
    outline: 3px solid var(--focus-ring);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s cubic-bezier(.25,.46,.45,.94), filter 0.4s;
    filter: brightness(0.82) saturate(0.85);
    pointer-events: none;
  }

  figure:hover img, figure:focus img {
    transform: scale(1.07);
    filter: brightness(1) saturate(1.1);
  }

  .thumb-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(10,9,7,0.8) 0%, transparent 100%);
    padding: 0.6rem 0.75rem 0.5rem;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 500;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.3s, transform 0.3s;
  }

  figure:hover .thumb-label, figure:focus .thumb-label {
    opacity: 1;
    transform: translateY(0);
  }

  .thumb-wrap::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.35s ease;
    z-index: 3;
  }

  .thumb-wrap:focus-within::before { transform: scaleX(1); }

  footer {
    text-align: center;
    margin-top: 3.5rem;
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  @media (prefers-reduced-motion: reduce) {
    .thumb-wrap img, .thumb-label, #image, #placeholder-text { transition: none; }
    body { scroll-behavior: auto; }
  }
</style>
</head>
<body>

  <a class="skip-link" href="#gallery">Bỏ qua đến thư viện ảnh</a>

  <header>
    <h1>Thư Viện Ảnh Tương Tác</h1>
    <h2>Di chuột hoặc dùng phím Tab để khám phá</h2>
  </header>

  <p class="keyboard-hint">Dùng phím <kbd>Tab</kbd> để chuyển giữa các ảnh, <kbd>Shift+Tab</kbd> để quay lại</p>

  <div id="preview-wrapper" role="region" aria-label="Ảnh xem trước">
    <div id="image" role="img" aria-label="Vùng xem trước ảnh">
      <span id="placeholder-text">Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.</span>
      <div id="caption" aria-live="polite" aria-atomic="true"></div>
    </div>
  </div>

  <section class="gallery-section" id="gallery" aria-label="Thư viện ảnh phong cảnh">
    <div class="gallery-grid">

      <div class="thumb-wrap">
        <figure tabindex="0"
          onmouseover="update(this.querySelector('img'))"
          onmouseout="undo()"
          onfocus="update(this.querySelector('img'))"
          onblur="undo()">
          <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=80"
               alt="Núi Alps hùng vĩ lúc bình minh với tuyết phủ trắng"/>
          <figcaption class="thumb-label" aria-hidden="true">Alps</figcaption>
        </figure>
      </div>

      <div class="thumb-wrap">
        <figure tabindex="0"
          onmouseover="update(this.querySelector('img'))"
          onmouseout="undo()"
          onfocus="update(this.querySelector('img'))"
          onblur="undo()">
          <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=80"
               alt="Bãi biển cát trắng nhiệt đới với nước biển trong xanh"/>
          <figcaption class="thumb-label" aria-hidden="true">Biển</figcaption>
        </figure>
      </div>

      <div class="thumb-wrap">
        <figure tabindex="0"
          onmouseover="update(this.querySelector('img'))"
          onmouseout="undo()"
          onfocus="update(this.querySelector('img'))"
          onblur="undo()">
          <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=600&q=80"
               alt="Rừng thông xanh thẫm phủ sương mù buổi sáng"/>
          <figcaption class="thumb-label" aria-hidden="true">Rừng</figcaption>
        </figure>
      </div>

      <div class="thumb-wrap">
        <figure tabindex="0"
          onmouseover="update(this.querySelector('img'))"
          onmouseout="undo()"
          onfocus="update(this.querySelector('img'))"
          onblur="undo()">
          <img src="https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=600&q=80"
               alt="Hoàng hôn màu cam rực trên sa mạc Sahara"/>
          <figcaption class="thumb-label" aria-hidden="true">Sa mạc</figcaption>
        </figure>
      </div>

      <div class="thumb-wrap">
        <figure tabindex="0"
          onmouseover="update(this.querySelector('img'))"
          onmouseout="undo()"
          onfocus="update(this.querySelector('img'))"
          onblur="undo()">
          <img src="https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?w=600&q=80"
               alt="Thác nước hùng tráng giữa rừng nhiệt đới xanh mướt"/>
          <figcaption class="thumb-label" aria-hidden="true">Thác nước</figcaption>
        </figure>
      </div>

      <div class="thumb-wrap">
        <figure tabindex="0"
          onmouseover="update(this.querySelector('img'))"
          onmouseout="undo()"
          onfocus="update(this.querySelector('img'))"
          onblur="undo()">
          <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=600&q=80"
               alt="Đồng cỏ xanh mướt trải dài dưới bầu trời đầy mây trắng"/>
          <figcaption class="thumb-label" aria-hidden="true">Đồng cỏ</figcaption>
        </figure>
      </div>

    </div>
  </section>

  <footer>
    <p>© 2026 Thư Viện Ảnh Tương Tác · Dự án học JavaScript</p>
  </footer>

  <script>
    function update(pic) {
      document.getElementById("caption").textContent = pic.alt;
      document.getElementById("placeholder-text").style.opacity = "0";
      document.getElementById("image").style.backgroundImage = "url('" + pic.src + "')";
      document.getElementById("image").setAttribute("aria-label", "Đang hiển thị: " + pic.alt);
    }

    function undo() {
      document.getElementById("image").style.backgroundImage = "";
      document.getElementById("caption").textContent = "";
      document.getElementById("placeholder-text").style.opacity = "1";
      document.getElementById("image").setAttribute("aria-label", "Vùng xem trước ảnh");
    }
  </script>

</body>
</html>
